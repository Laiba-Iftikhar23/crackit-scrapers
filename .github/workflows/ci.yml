name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; this workflow needs no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, compile, fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --quiet ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Compile all Python
        run: python -m compileall -q spikes tests
      - name: Fixture tests
        run: python -m pytest -q tests
